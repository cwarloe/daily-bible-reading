name: Update Daily Bible Reading

on:
  schedule:
    # 02:17 MST / 03:17 MDT. Date is always calculated in America/Boise.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: daily-bible-reading
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test calendar and generator
        run: python -m unittest discover -s tests -v
      - name: Generate today's Boise reading
        env:
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
        run: python generate_page.py
      - uses: actions/configure-pages@v5
      - name: Upload current page
        id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Deploy current page
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python verify_live.py
      - name: Keep the overnight schedule active
        # GitHub disables schedules after 60 days without repository activity.
        # A monthly empty commit contains no Scripture or generated files.
        run: |
          last_commit=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last_commit )) -ge 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep daily reading schedule active"
            git push origin HEAD:main
          fi
      - name: Remove temporary Scripture artifact
        if: always() && steps.artifact.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
